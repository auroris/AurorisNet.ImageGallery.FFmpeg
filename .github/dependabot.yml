# Dependabot opens the pull requests that .github/workflows/ci.yml builds and merges, as docs/releasing.md in
# auroris/AurorisNet.Build describes. The workflows pin each action to a commit; Dependabot updates the commit and the
# version in the comment beside it.
#
# FFmpeg itself, MSYS2 and the compiler packages are pinned by checksum in build/inputs.json, which Dependabot does not
# read. upstream.yml moves the FFmpeg pin.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
