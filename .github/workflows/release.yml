name: Release

run-name: Release the pinned FFmpeg${{ inputs.dry-run && ' (dry run)' || '' }}

# Builds the FFmpeg release that build/inputs.json pins, tests the package and publishes it to nuget.org and GitHub.
# Starts by hand, or from upstream.yml after it has moved the pin to a new FFmpeg release. The package version is the
# FFmpeg release, read from the .nuspec file, so the workflow has no version input. The publish steps come from
# auroris/AurorisNet.Build, whose docs/releasing.md describes them.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, pack and test only, and keep the package and sources as an artifact
        type: boolean
        default: false
      notes:
        description: Notes for the GitHub release, in Markdown, shown above the generated list of changes
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and test the package
    # The native build runs MSYS2 and MinGW-w64, and the test runs the Windows executables it made.
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      ffmpeg: ${{ steps.version.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Build the Windows tools and the matching sources
        run: ./build/Build-Native.ps1

      - name: Pack
        run: dotnet pack ./AurorisNet.ImageGallery.FFmpeg.nuspec -o artifacts/packages

      # The binaries are new in every run, so the test always runs before a release.
      - name: Test a published consumer on each input codec
        run: ./test/Test-Package.ps1

      - name: Read the package and FFmpeg versions
        id: version
        run: |
          $spec = [xml](Get-Content -Raw AurorisNet.ImageGallery.FFmpeg.nuspec)
          $inputs = Get-Content -Raw build/inputs.json | ConvertFrom-Json
          "version=$($spec.package.metadata.version)" >> $env:GITHUB_OUTPUT
          "ffmpeg=$($inputs.ffmpeg.version)" >> $env:GITHUB_OUTPUT

      # A dry run ends here, with the files a release of this commit would publish.
      - name: Keep the tested package and the matching sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            artifacts/packages/*.nupkg
            artifacts/ffmpeg-*-sources.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org and GitHub
    needs: build
    if: ${{ !inputs.dry-run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: artifacts

      # The GPL asks that the source travels with the binaries, so every release names its source archive.
      - name: Publish
        uses: auroris/AurorisNet.Build/actions/publish@main
        with:
          versions: ${{ needs.build.outputs.version }}
          packages: artifacts/packages
          assets: artifacts/ffmpeg-*-sources.zip
          notes: |
            ${{ inputs.notes }}

            FFmpeg ${{ needs.build.outputs.ffmpeg }} for Windows x64, built with x264, dav1d and zlib. `ffmpeg-${{ needs.build.outputs.ffmpeg }}-sources.zip` holds the sources and build scripts of the binaries in this package.
