name: Release latest FFmpeg

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the update without committing or releasing
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency: upstream-ffmpeg

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the latest stable FFmpeg and release it if needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ !inputs.dry-run }}
        run: ./automation/Update-Upstream.ps1 -Apply:($env:APPLY -eq 'true')
